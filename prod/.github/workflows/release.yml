name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, native: true }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, native: true }
          - { os: macos-latest, target: aarch64-apple-darwin, native: true }
          - { os: macos-latest, target: x86_64-apple-darwin, native: false }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, native: true }
    steps:
      - uses: actions/checkout@v4

      - name: Setup Visual Studio environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Static CRT for Windows
        if: runner.os == 'Windows'
        shell: bash
        run: echo "RUSTFLAGS=-C target-feature=+crt-static" >> "$GITHUB_ENV"

      - name: Run tests
        if: matrix.native
        run: cargo test --release --target ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (macOS & Linux)
        if: runner.os != 'Windows'
        run: sh scripts/package.sh ${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/package.ps1 ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: conduit-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -l dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --title "Conduit ${{ github.ref_name }}" --generate-notes

