[book]
authors = ["The Conduit Team"]
description = "Official documentation for the Conduit programming language"
language = "en"
multilingual = false
src = "src"
title = "The Conduit Programming Language"

[output.html]
site-url = "/conduit/"
git-repository-url = "https://github.com/resoul/conduit"
edit-url-template = "https://github.com/resoul/conduit/edit/main/docs/{path}"
additional-js = ["theme/conduit-highlight.js"]
default-theme = "rust"
preferred-dark-theme = "navy"

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3

